<style>

</div>
<script>
const c=document.getElementById('c'),g=c.getContext('2d');let W,H,P=[],mx=.5,my=.5;
function rs(){W=c.width=innerWidth;H=c.height=innerHeight;P=Array.from({length:Math.min(200,innerWidth/6)},()=>({x:Math.random()*W,y:Math.random()*H,vx:0,vy:0}))}
addEventListener('resize',rs);rs();addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY});
(function f(){g.fillStyle='#0b0b0c';g.fillRect(0,0,W,H);for(const p of P){p.vx+=(W/2-p.x)*.0002;p.vy+=(H*.35-p.y)*.0002;const dx=p.x-mx,dy=p.y-my,d=Math.hypot(dx,dy);if(d<180){p.vx+=dx/d*1.4;p.vy+=dy/d*1.4}p.vx*=.92;p.vy*=.92;p.x+=p.vx;p.y+=p.vy;g.fillStyle=d<180?'#f0b429':'rgba(244,241,234,.4)';g.fillRect(p.x,p.y,3,3)}requestAnimationFrame(f)})();
</script>
</body></html>
